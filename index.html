        window.deleteSession = function(sessionId, sessionTitle) {
            const confirmed = confirm(`Apakah Anda yakin ingin menghapus sesi ujian "${sessionTitle}"?\n\nPerangkat siswa tidak akan bisa mengakses ujian ini lagi.`);
            if (!confirmed) return;

            const targetSess = CBTApp.sessions.find(s => s.id === sessionId);
            CBTApp.sessions = CBTApp.sessions.filter(s => s.id !== sessionId);
            CBTApp.save('sessions');

            if (CBTApp.gasUrl && targetSess) {
                fetch(CBTApp.gasUrl, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'deleteSession', token: targetSess.token })
                }).catch(e => console.warn('Delete GAS error:', e));
            }

            showToast(`Sesi ujian "${sessionTitle}" berhasil dihapus!`, "info");
            renderTabSessions();
        };

        window.saveServerConfigSettings = function() {
            const ip = document.getElementById('setting-custom-ip').value.trim();
            const gas = document.getElementById('setting-gas-url').value.trim();
            CBTApp.customServerIP = ip;
            CBTApp.gasUrl = gas;
            localStorage.setItem('cbt_custom_ip', ip);
            localStorage.setItem('cbt_gas_url', gas);
            showToast('Konfigurasi IP & Google Sheets tersimpan!', 'success');
            renderTabSessions();
        };

        window.handleCreateSession = function(e) {
            e.preventDefault();
            const grade = document.getElementById('sess-grade').value;
            const targetQuestions = CBTApp.questions.filter(q => q.grade === grade);

            if (targetQuestions.length === 0) {
                showToast(`Bank soal Kelas ${grade} masih kosong!`, 'error');
                return;
            }

            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let token = '';
            for (let i = 0; i < 6; i++) token += chars.charAt(Math.floor(Math.random() * chars.length));

            const newSession = {
                id: 'sess_' + Date.now(),
                title: document.getElementById('sess-title').value,
                grade: grade,
                duration: parseInt(document.getElementById('sess-duration').value),
                token: token,
                questions: targetQuestions,
                createdAt: new Date().toISOString()
            };

            CBTApp.sessions.unshift(newSession);
            CBTApp.save('sessions');

            if (CBTApp.gasUrl) {
                fetch(CBTApp.gasUrl, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'saveSession', session: newSession })
                }).then(() => {
                    showToast('Sesi ujian otomatis tersinkron ke Google Sheets!', 'success');
                }).catch(e => console.warn('Sync GAS error:', e));
            }

            showToast('Sesi Ujian & Alamat IP Siswa Berhasil Diterbitkan!', 'success');
            renderTabSessions();
        };

        window.addPgkOptionRow = function(presetLetter) {

        function refreshPgkLetters() {
            const list = document.getElementById('pgk-options-list');
            if (!list) return;
            const rows = list.querySelectorAll('.pgk-row');
            rows.forEach((row, idx) => {
                const letter = String.fromCharCode(65 + idx);

        window.handleManualAddQuestion = function(e) {
            e.preventDefault();
            const grade = CBTApp.selectedBankGrade;
            const type = document.getElementById('m-q-type').value;
            const text = document.getElementById('m-q-text').value.trim();
            const weight = parseInt(document.getElementById('m-q-weight').value) || 10;

            const newQ = {
                id: 'q_' + Date.now(),
                grade: grade,
                type: type,
                questionText: text,
                weight: weight
            };

            if (type === 'pg') {
                const optA = document.getElementById('m-opt-A').value.trim();
                const optB = document.getElementById('m-opt-B').value.trim();
                const optC = document.getElementById('m-opt-C').value.trim();
                const optD = document.getElementById('m-opt-D').value.trim();
                const optE = document.getElementById('m-opt-E').value.trim();
                newQ.options = [optA, optB, optC, optD];
                if (optE) newQ.options.push(optE);
                newQ.correctAnswer = document.getElementById('m-key-pg').value;
            } else if (type === 'pgk') {
                const list = document.getElementById('pgk-options-list');
                const rows = list.querySelectorAll('.pgk-row');
                const options = [];
                const checked = [];

                rows.forEach((row) => {
                    const val = row.querySelector('.pgk-text').value.trim();
                    const chk = row.querySelector('.pgk-checkbox');
                    options.push(val);
                    if (chk.checked) checked.push(chk.value);
                });

                if (options.length < 2) return showToast("Minimal sediakan 2 opsi jawaban!", "error");
                if (checked.length === 0) return showToast("Centang minimal 1 kunci jawaban benar untuk PGK!", "error");

                newQ.options = options;
                newQ.correctAnswer = checked;
            } else if (type === 'bs') {
                newQ.correctAnswer = document.getElementById('m-key-bs').value;
            } else if (type === 'matching') {
                const list = document.getElementById('matching-pairs-list');
                const rows = list.querySelectorAll('.matching-row');
                const pairs = [];

                rows.forEach(row => {
                    const l = row.querySelector('.matching-left').value.trim();
                    const r = row.querySelector('.matching-right').value.trim();
                    if (l && r) pairs.push({ left: l, right: r });
                });

                if (pairs.length < 2) return showToast("Minimal sediakan 2 pasang pernyataan!", "error");
                newQ.pairs = pairs;
            } else if (type === 'isian') {
                newQ.correctAnswer = document.getElementById('m-key-isian').value.trim();
            }

            CBTApp.questions.push(newQ);
            CBTApp.save('questions');
            showToast(`Soal tipe ${type.toUpperCase()} berhasil disimpan!`, 'success');
            renderTabBank();
        };

        window.handleQuestionFileUpload = function() {
            const file = document.getElementById('file-upload-question').files[0];
            if (!file) return showToast("Pilih file soal terlebih dahulu!", "error");

            const grade = CBTApp.selectedBankGrade;
            const ext = file.name.split('.').pop().toLowerCase();

            if (ext === 'docx') {
                const reader = new FileReader();
                reader.onload = function(e) {
                    mammoth.extractRawText({ arrayBuffer: e.target.result })
                        .then(result => {
                            parseDocxQuestionText(result.value, grade);
                        })
                        .catch(err => {
                            showToast("Gagal membaca file Word .docx!", "error");
                        });
                };
                reader.readAsArrayBuffer(file);
            } else if (ext === 'xlsx' || ext === 'xls') {
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        const json = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
                        json.forEach((row, i) => {
                            const newQ = {
                                id: 'q_' + Date.now() + '_' + i,
                                grade: grade,
                                type: (row.type || 'pg').toLowerCase(),
                                questionText: row.questionText || row.soal || row.Pertanyaan,
                                options: [String(row.optionA||row.A||''), String(row.optionB||row.B||''), String(row.optionC||row.C||''), String(row.optionD||row.D||'')].filter(Boolean),
                                correctAnswer: String(row.correctAnswer || row.Kunci || 'A').trim().toUpperCase(),
                                weight: parseInt(row.weight || 10)
                            };
                            if (row.optionE || row.E) newQ.options.push(String(row.optionE || row.E));
                            if (row.optionF || row.F) newQ.options.push(String(row.optionF || row.F));
                            CBTApp.questions.push(newQ);
                        });
                        CBTApp.save('questions');
                        showToast(`Berhasil import soal Excel ke Kelas ${grade}!`, 'success');
                        renderTabBank();
                    } catch(err) { showToast("Gagal membaca file Excel!", "error"); }
                };
                reader.readAsArrayBuffer(file);
            } else if (ext === 'json') {
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const parsed = JSON.parse(e.target.result);
                        if (Array.isArray(parsed)) {
                            parsed.forEach((q, i) => {
                                q.id = 'q_' + Date.now() + '_' + i;
                                q.grade = grade;
                                CBTApp.questions.push(q);
                            });
                            CBTApp.save('questions');
                            showToast(`Berhasil upload soal JSON ke Kelas ${grade}!`, 'success');
                            renderTabBank();
                        }
                    } catch(err) { showToast("Format JSON tidak valid!", "error"); }
                };
                reader.readAsText(file);
            }
        };

        function parseDocxQuestionText(rawText, grade) {
            const lines = rawText.split('\n').map(l => l.trim()).filter(Boolean);
            let currentQ = null;
            let addedCount = 0;

            lines.forEach((line) => {
                const matchNumber = line.match(/^(\d+)[\.\)]\s*(.+)/);
                const matchOption = line.match(/^([A-Za-z])[\.\)]\s*(.+)/);
                const matchKey = line.match(/^(?:KUNCI|JAWABAN|ANSWER)[\:\=]\s*([A-Za-z0-9\,\s]+)/i);

                if (matchNumber) {
                    if (currentQ && currentQ.questionText) {
                        CBTApp.questions.push(currentQ);
                        addedCount++;
                    }
                    currentQ = {
                        id: 'q_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
                        grade: grade,
                        type: 'pg',
                        questionText: matchNumber[2],
                        options: [],
                        correctAnswer: 'A',
                        weight: 20
                    };
                } else if (matchOption && currentQ) {
                    currentQ.options.push(matchOption[2]);
                } else if (matchKey && currentQ) {
                    const rawKey = matchKey[1].trim().toUpperCase();
                    if (rawKey.includes(',')) {
                        currentQ.type = 'pgk';
                        currentQ.correctAnswer = rawKey.split(',').map(s => s.trim());
                    } else {
                        currentQ.correctAnswer = rawKey;
                    }
                } else if (currentQ && currentQ.options.length === 0) {
                    currentQ.questionText += ' ' + line;
                }
            });

            if (currentQ && currentQ.questionText) {
                CBTApp.questions.push(currentQ);
                addedCount++;
            }

            if (addedCount > 0) {
                CBTApp.save('questions');
                showToast(`Berhasil membaca ${addedCount} butir soal dari file Word!`, 'success');
                renderTabBank();
            } else {
                showToast("Format soal di Word tidak terbaca. Pastikan ada nomor soal (1.) dan opsi (A., B.)", "error");
            }
        }

        window.handleStudentFileUpload = function() {
            const fileInput = document.getElementById('file-upload-student');
            const file = fileInput.files[0];
            if (!file) return showToast("Pilih file data siswa terlebih dahulu!", "error");

            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    let newlyImported = [];

                    workbook.SheetNames.forEach(sheetName => {
                        const cleanSheet = sheetName.trim();
                        if (cleanSheet.toLowerCase().includes('sheet2')) return;

                        const worksheet = workbook.Sheets[sheetName];
                        const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: '' });

                        let headerRowIdx = -1;
                        let colNameIdx = -1;
                        let colNisnIdx = -1;

                        for (let r = 0; r < rows.length; r++) {
                            const row = rows[r];
                            for (let c = 0; c < row.length; c++) {
                                const cellText = String(row[c]).toUpperCase().trim();
                                if (cellText.includes('NAMA PESERTA DIDIK') || cellText === 'NAMA') {
                                    headerRowIdx = r;
                                    colNameIdx = c;
                                }
                                if (cellText.includes('NISN') || cellText.includes('NIS')) {
                                    colNisnIdx = c;
                                }
                            }
                            if (headerRowIdx !== -1) break;
                        }

                        if (headerRowIdx !== -1 && colNameIdx !== -1) {
                            const className = cleanSheet.toUpperCase();
                            const grade = className.split('-')[0] || 'X';

                            for (let r = headerRowIdx + 1; r < rows.length; r++) {
                                const row = rows[r];
                                const rawName = String(row[colNameIdx] || '').trim();
                                const rawNisn = colNisnIdx !== -1 ? String(row[colNisnIdx] || '').trim() : '';

                                const isNoise = ['LAKI', 'PEREMPUAN', 'JUMLAH', 'TOTAL', 'MENGETAHUI', 'NIP', 'WALI KELAS', 'NO', 'NISN'].some(k => rawName.toUpperCase().includes(k));

                                if (rawName && !isNoise && rawName.length > 2 && isNaN(rawName)) {
                                    newlyImported.push({
                                        id: 'st_' + className + '_' + (newlyImported.length + 1),
                                        grade: grade,
                                        class: className,
                                        nisn: rawNisn,
                                        name: rawName
                                    });
                                }
                            }
                        }
                    });

                    if (newlyImported.length > 0) {
                        const importedClasses = [...new Set(newlyImported.map(s => s.class))];
                        CBTApp.students = CBTApp.students.filter(s => !importedClasses.includes(s.class)).concat(newlyImported);
                        CBTApp.save('students');

                        showToast(`Berhasil mengimpor ${newlyImported.length} siswa untuk kelas: ${importedClasses.join(', ')}!`, 'success');
                        renderTabStudents();
                    } else {
                        showToast("Format tabel tidak cocok. Pastikan ada kolom 'NAMA PESERTA DIDIK'", "error");
                    }

                } catch(err) {
                    console.error(err);
                    showToast('Gagal memproses file Excel siswa!', 'error');
                }
            };
            reader.readAsArrayBuffer(file);
        };

                return Array.from(set).sort((a,b) => {
                    const partsA = String(a).split('-');
                    const partsB = String(b).split('-');
                    if (partsA[0] !== partsB[0]) return partsA[0].localeCompare(partsB[0]);
                    return (parseInt(partsA[1]) || 0) - (parseInt(partsB[1]) || 0);

        window.deleteResultByIndex = function(idx) {
            const filtered = getFilteredResults();
            const target = filtered[idx];
            if (!target) return;

            const confirmed = confirm(`Apakah Anda yakin ingin menghapus data siswa:\n"${target.studentName}" (${target.studentClass}) - Token: ${target.token}?\n\nData ini akan dihapus dari dasbor dan Google Sheets.`);
            if (!confirmed) return;

            CBTApp.results = (CBTApp.results || []).filter(r => !(r.studentName === target.studentName && r.token === target.token));
            CBTApp.save('results');

            const activeCloudUrl = CBTApp.gasUrl || DEFAULT_GOOGLE_SCRIPT_URL;
            if (activeCloudUrl && activeCloudUrl.startsWith('http')) {
                fetch(activeCloudUrl, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'deleteResult', studentName: target.studentName, token: target.token })
                }).catch(e => console.warn('Delete result GAS error:', e));
            }

            showToast(`Data ujian "${target.studentName}" berhasil dihapus!`, 'success');
            renderTabResults();
        };

        window.fetchLiveResultsFromCloud = function(showNotice = false) {
            const activeCloudUrl = CBTApp.gasUrl || DEFAULT_GOOGLE_SCRIPT_URL;
            if (!activeCloudUrl || !activeCloudUrl.startsWith('http')) return;

            fetch(`${activeCloudUrl}?action=getResults`)
                .then(res => res.json())
                .then(data => {
                    if (data.status === 'success' && Array.isArray(data.results)) {
                        CBTApp.results = data.results;
                        CBTApp.save('results');
                        const tbody = document.getElementById('results-table-body');
                        const lblCount = document.getElementById('lbl-result-count');

                        if (lblCount) lblCount.innerText = getFilteredResults().length;

                .catch(e => {

        window.exportToCSV = function() {
            if (!CBTApp.results || CBTApp.results.length === 0) return showToast("Belum ada data nilai!", "error");
            
            let csv = "Nama,Kelas,Token,Status,Skor,MaxSkor,Persentase,Pelanggaran,Waktu\n";
            CBTApp.results.forEach(r => {
                if (!r) return;
                csv += `"${r.studentName || ''}","${r.studentClass || ''}","${r.token || ''}","${r.status || 'SELESAI'}",${r.score || 0},${r.maxScore || 100},${Number(r.percentage || 0).toFixed(0)},${r.violations || 0},"${r.submittedAt || ''}"\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", `Rekap_Nilai_${Date.now()}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            showToast("File CSV rekap nilai berhasil diunduh!", "success");
        };

        // ========================================================
        // TAMPILAN KHUSUS SISWA
        // ========================================================
        window.renderStudentLanding = function() {
            document.getElementById('proctor-header').classList.add('hidden');
            const urlToken = new URLSearchParams(window.location.search).get('token') || '';
            const container = document.getElementById('app-container');

            container.innerHTML = `
                <div class="max-w-md mx-auto my-6 bg-white p-6 sm:p-8 rounded-3xl shadow-xl border border-slate-100">
                    <div class="text-center mb-6">
                        <div class="w-14 h-14 bg-indigo-50 text-indigo-600 rounded-2xl flex items-center justify-center text-2xl mx-auto mb-3 shadow-sm">
                            <i class="fa-solid fa-pen-to-square"></i>
                        </div>
                        <h2 class="text-xl font-bold text-slate-800">Ujian Online Siswa</h2>
                        <p class="text-xs text-slate-500 mt-0.5">Pilih tingkat, kelas dan nama Anda untuk memulai ujian</p>
                    </div>

                    <form onsubmit="handleStartExam(event)" class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Tingkatan Kelas</label>
                            <select id="student-grade-select" onchange="updateClassRombelDropdown()" required class="w-full px-3.5 py-2.5 rounded-xl border text-xs font-bold text-slate-700 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                                <option value="">-- Pilih Tingkatan --</option>
                                <option value="X">Kelas X</option>
                                <option value="XI">Kelas XI</option>
                                <option value="XII">Kelas XII</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Rombongan Belajar (Kelas)</label>
                            <select id="student-class-select" onchange="updateStudentNameDropdown()" required class="w-full px-3.5 py-2.5 rounded-xl border text-xs font-semibold text-slate-700 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                                <option value="">-- Pilih Tingkatan Dahulu --</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Nama Lengkap Siswa</label>
                            <select id="student-name-select" required class="w-full px-3.5 py-2.5 rounded-xl border text-xs text-slate-700 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                                <option value="">-- Pilih Kelas Terlebih Dahulu --</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Token Ujian</label>
                            <input type="text" id="student-token" maxlength="6" value="${urlToken}" required placeholder="Contoh: A1B2C3"
                                class="w-full px-3.5 py-2.5 rounded-xl border text-center font-mono font-black text-lg tracking-widest text-indigo-600 uppercase focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        </div>

                        <div class="p-3 bg-rose-50 border border-rose-200 rounded-xl text-[11px] text-rose-900 space-y-1">
                            <div class="font-bold flex items-center gap-1.5"><i class="fa-solid fa-triangle-exclamation text-rose-600"></i> Peringatan Anti-Curang Aktif:</div>
                            <p>Ujian wajib berjalan dalam mode <strong>Layar Penuh (Fullscreen)</strong>. Keluar layar penuh atau berpindah tab otomatis tercatat sebagai pelanggaran (Maksimal 3 kali toleransi)!</p>
                        </div>

                        <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl text-xs shadow-lg shadow-indigo-500/20 transition">
                            Masuk & Mulai Mengerjakan
                        </button>
                    </form>
                </div>
            `;
        };

        window.updateClassRombelDropdown = function() {
            const grade = document.getElementById('student-grade-select').value;
            const classSelect = document.getElementById('student-class-select');
            const nameSelect = document.getElementById('student-name-select');
            
            classSelect.innerHTML = '<option value="">-- Pilih Rombel Kelas --</option>';
            nameSelect.innerHTML = '<option value="">-- Pilih Kelas Terlebih Dahulu --</option>';

            if (!grade) return;
            const rombels = [...new Set(CBTApp.students.filter(s => s.grade === grade).map(s => s.class))].sort((a,b) => {
                const nA = parseInt(a.split('-')[1]) || 0;
                const nB = parseInt(b.split('-')[1]) || 0;
                return nA - nB;
            });
            rombels.forEach(r => {
                const opt = document.createElement('option');
                opt.value = r;
                opt.textContent = `Kelas ${r}`;
                classSelect.appendChild(opt);
            });
        };

        window.updateStudentNameDropdown = function() {
            const cls = document.getElementById('student-class-select').value;
            const nameEl = document.getElementById('student-name-select');
            nameEl.innerHTML = '<option value="">-- Pilih Nama Anda --</option>';

            const filtered = CBTApp.students.filter(s => s.class === cls);
            if (filtered.length === 0) {
                nameEl.innerHTML = '<option value="">Tidak ada siswa terdaftar di kelas ini</option>';
                return;
            }

            filtered.forEach(st => {
                const opt = document.createElement('option');
                opt.value = st.name;
                opt.textContent = st.nisn ? `${st.name} (${st.nisn})` : st.name;
                nameEl.appendChild(opt);
            });
        };

        window.handleStartExam = function(e) {
            e.preventDefault();
            const grade = document.getElementById('student-grade-select').value;
            const cls = document.getElementById('student-class-select').value;
            const name = document.getElementById('student-name-select').value;
            const token = document.getElementById('student-token').value.trim().toUpperCase();

            let session = CBTApp.sessions.find(s => s.token === token);
            const activeCloudUrl = CBTApp.gasUrl || DEFAULT_GOOGLE_SCRIPT_URL;

            if (activeCloudUrl && activeCloudUrl.startsWith('http')) {
                fetch(activeCloudUrl, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'startExamLog',
                        student: { name: name, class: cls, token: token }
                    })
                }).catch(()=>{});
            }

            if (!session && activeCloudUrl && activeCloudUrl.startsWith('http')) {
                showToast("Mengambil soal ujian dari Google Sheets...", "info");
                fetch(`${activeCloudUrl}?action=getSession&token=${token}`)
                    .then(res => res.json())
                    .then(data => {
                        if (data.status === 'success' && data.session) {
                            session = data.session;
                            CBTApp.sessions.push(session);
                            CBTApp.save('sessions');
                            launchStudentExam(session, name, cls, grade);
                        } else {
                            showToast("Token Ujian tidak ditemukan di Google Sheets!", "error");
                        }
                    })
                    .catch(err => {
                        showToast("Gagal mengambil data dari Google Sheets. Periksa koneksi internet!", "error");
                    });
                return;
            }

            if (!session) return showToast("Token Ujian tidak ditemukan / tidak aktif!", "error");
            launchStudentExam(session, name, cls, grade);
        };

        function launchStudentExam(session, name, cls, grade) {
            CBTApp.currentExamSession = session;
            CBTApp.studentInfo = { name: name, class: cls, grade: grade };
            CBTApp.userAnswers = {};
            CBTApp.currentQuestionIdx = 0;
            CBTApp.remainingSeconds = session.duration * 60;
            CBTApp.violationCount = 0;

            requestFullScreen();
            setupAntiCheat();
            renderExamScreen();
            startTimer();
        }

        function requestFullScreen() {
            const el = document.documentElement;
            if (el.requestFullscreen) el.requestFullscreen().catch(()=>{});
            else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
        }

        function setupAntiCheat() {
            document.addEventListener('visibilitychange', handleViolation);
            window.addEventListener('blur', handleViolation);
            document.addEventListener('fullscreenchange', () => {
                if (!document.fullscreenElement) handleViolation();
            });
        }

        function handleViolation() {
            if (!CBTApp.currentExamSession) return;
            CBTApp.violationCount++;
            const sisa = CBTApp.maxViolations - CBTApp.violationCount;

            alert(`[PERINGATAN KECURANGAN ${CBTApp.violationCount}/${CBTApp.maxViolations}]\nAnda terdeteksi keluar dari layar penuh atau berpindah tab!\nTindakan telah dilaporkan ke server proktor.\nSisa toleransi: ${Math.max(0, sisa)} kali`);

            requestFullScreen();

            if (CBTApp.violationCount >= CBTApp.maxViolations) {
                alert("Batas toleransi habis! Ujian otomatis dikumpulkan.");
                finishExam();
            }
        }

        function renderExamScreen() {
            const session = CBTApp.currentExamSession;
            const q = session.questions[CBTApp.currentQuestionIdx];
            const container = document.getElementById('app-container');

            container.innerHTML = `
                <div class="space-y-4 user-select-none max-w-4xl mx-auto">
                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex justify-between items-center">
                        <div>
                            <h3 class="font-bold text-slate-800 text-sm sm:text-base">${session.title}</h3>
                            <p class="text-xs text-slate-500">${CBTApp.studentInfo.name} (${CBTApp.studentInfo.class})</p>
                        </div>
                        <div class="flex items-center gap-2 sm:gap-3">
                            <span class="px-2.5 py-1 bg-rose-50 text-rose-700 border border-rose-200 rounded-xl text-[11px] font-bold">
                                Pelanggaran: ${CBTApp.violationCount} / ${CBTApp.maxViolations}
                            </span>
                            <div class="bg-slate-900 text-white px-3 py-1 rounded-xl font-mono text-xs font-bold" id="exam-timer">
                                00:00:00
                            </div>
                        </div>
                    </div>

                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-5">
                        <div class="flex justify-between items-center border-b pb-3 text-xs text-slate-500 font-bold">
                            <span>SOAL NO. ${CBTApp.currentQuestionIdx + 1} DARI ${session.questions.length}</span>
                            <span>Bobot: ${q.weight}</span>
                        </div>

                        <p class="text-base font-semibold text-slate-800 leading-relaxed">${q.questionText}</p>

                        <div class="space-y-2 pt-2">
                            ${renderStudentAnswerOptions(q)}
                        </div>

                        <div class="flex justify-between pt-4 border-t">
                            <button onclick="navigateQuestion(-1)" ${CBTApp.currentQuestionIdx===0?'disabled class="opacity-40 px-4 py-2 border rounded-xl text-xs"':'class="px-4 py-2 bg-slate-800 text-white rounded-xl text-xs"'}>Sebelumnya</button>
                            ${CBTApp.currentQuestionIdx === session.questions.length - 1 ? 
                                `<button onclick="finishExam()" class="px-5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold shadow">Kumpulkan Ujian</button>` :
                                `<button onclick="navigateQuestion(1)" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs">Selanjutnya</button>`
                            }
                        </div>
                    </div>
                </div>
            `;
        }

        function renderStudentAnswerOptions(q) {
            const ans = CBTApp.userAnswers[q.id];

            if (q.type === 'pg' || !q.type) {
                return (q.options || []).map((opt, idx) => {
                    const letter = String.fromCharCode(65 + idx);
                    const isSel = ans === letter;
                    return `
                        <div onclick="saveAnswer('${q.id}', '${letter}')" 
                            class="p-3.5 rounded-xl border flex items-center gap-3 cursor-pointer transition ${isSel ? 'bg-indigo-50 border-indigo-600 text-indigo-900 font-bold' : 'hover:bg-slate-50 border-slate-200 text-slate-700'}">
                            <div class="w-6 h-6 rounded-lg text-xs flex items-center justify-center border font-bold ${isSel ? 'bg-indigo-600 text-white' : 'bg-white'}">${letter}</div>
                            <span class="text-xs sm:text-sm">${opt}</span>
                        </div>
                    `;
                }).join('');
            }

            if (q.type === 'pgk') {
                const currentArr = Array.isArray(ans) ? ans : [];
                return (q.options || []).map((opt, idx) => {
                    const letter = String.fromCharCode(65 + idx);
                    const isSel = currentArr.includes(letter);
                    return `
                        <div onclick="togglePgkAnswer('${q.id}', '${letter}')" 
                            class="p-3.5 rounded-xl border flex items-center gap-3 cursor-pointer transition ${isSel ? 'bg-purple-50 border-purple-600 text-purple-900 font-bold' : 'hover:bg-slate-50 border-slate-200 text-slate-700'}">
                            <div class="w-6 h-6 rounded-lg text-xs flex items-center justify-center border font-bold ${isSel ? 'bg-purple-600 text-white' : 'bg-white'}">
                                ${isSel ? '<i class="fa-solid fa-check text-[10px]"></i>' : letter}
                            </div>
                            <span class="text-xs sm:text-sm">${opt}</span>
                        </div>
                    `;
                }).join('');
            }

            if (q.type === 'bs') {
                return ['BENAR', 'SALAH'].map(val => {
                    const isSel = ans === val;
                    return `
                        <div onclick="saveAnswer('${q.id}', '${val}')" 
                            class="p-3.5 rounded-xl border flex items-center gap-3 cursor-pointer transition ${isSel ? 'bg-amber-50 border-amber-600 text-amber-900 font-bold' : 'hover:bg-slate-50 border-slate-200 text-slate-700'}">
                            <div class="w-6 h-6 rounded-lg text-xs flex items-center justify-center border font-bold ${isSel ? 'bg-amber-600 text-white' : 'bg-white'}">${val[0]}</div>
                            <span class="text-xs sm:text-sm font-semibold">${val}</span>
                        </div>
                    `;
                }).join('');
            }

            if (q.type === 'matching') {
                const pairs = q.pairs || [];
                const currentMatches = typeof ans === 'object' && ans !== null ? ans : {};
                const allRightOptions = pairs.map(p => p.right);

                return `
                    <div class="space-y-3">
                        <p class="text-xs text-slate-500">Pasangkan pernyataan di kiri dengan pilihan jawaban di kanan:</p>
                        ${pairs.map((p, idx) => `
                            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 p-3 bg-slate-50 border rounded-xl">
                                <span class="text-xs font-bold text-slate-700">${idx+1}.${p.left}</span>
                                <select onchange="saveMatchingAnswer('${q.id}', '${p.left}', this.value)" class="px-2.5 py-1.5 border rounded-lg text-xs bg-white font-semibold text-indigo-700">
                                    <option value="">-- Pilih Pasangan --</option>
                                    ${allRightOptions.map(rOpt => `
                                        <option value="${rOpt}" ${currentMatches[p.left] === rOpt ? 'selected' : ''}>${rOpt}</option>
                                    `).join('')}
                                </select>
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            if (q.type === 'isian') {
                return `
                    <div class="space-y-1">
                        <label class="block text-xs font-semibold text-slate-600">Jawaban Singkat Anda:</label>
                        <input type="text" value="${ans || ''}" oninput="saveAnswer('${q.id}', this.value)" placeholder="Ketik jawaban di sini..." 
                            class="w-full p-3 border rounded-xl text-sm font-semibold focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                `;
            }

            if (q.type === 'essay') {
                return `
                    <div class="space-y-1">
                        <label class="block text-xs font-semibold text-slate-600">Jawaban Essay / Uraian:</label>
                        <textarea rows="5" oninput="saveAnswer('${q.id}', this.value)" placeholder="Tuliskan uraian jawaban secara lengkap di sini..." 
                            class="w-full p-3 border rounded-xl text-xs leading-relaxed focus:ring-2 focus:ring-indigo-500 focus:outline-none">${ans || ''}</textarea>
                    </div>
                `;
            }

            return '';
        }

        window.saveAnswer = function(qid, val) {
            CBTApp.userAnswers[qid] = val;
            if (CBTApp.currentExamSession.questions[CBTApp.currentQuestionIdx].type === 'pg' || CBTApp.currentExamSession.questions[CBTApp.currentQuestionIdx].type === 'bs') {
                renderExamScreen();
            }
        };

        window.togglePgkAnswer = function(qid, letter) {
            let cur = CBTApp.userAnswers[qid];
            if (!Array.isArray(cur)) cur = [];
            if (cur.includes(letter)) cur = cur.filter(x => x !== letter);
            else cur.push(letter);
            CBTApp.userAnswers[qid] = cur;
            renderExamScreen();
        };

        window.saveMatchingAnswer = function(qid, leftKey, rightVal) {
            if (!CBTApp.userAnswers[qid] || typeof CBTApp.userAnswers[qid] !== 'object') {
                CBTApp.userAnswers[qid] = {};
            }
            CBTApp.userAnswers[qid][leftKey] = rightVal;
        };

        window.navigateQuestion = function(delta) {
            const next = CBTApp.currentQuestionIdx + delta;
            if (next >= 0 && next < CBTApp.currentExamSession.questions.length) {
                CBTApp.currentQuestionIdx = next;
                renderExamScreen();
            }
        };

        function startTimer() {
            if (CBTApp.timerInterval) clearInterval(CBTApp.timerInterval);
            CBTApp.timerInterval = setInterval(() => {
                if (CBTApp.remainingSeconds <= 0) {
                    clearInterval(CBTApp.timerInterval);
                    finishExam();
                    return;
                }
                const h = Math.floor(CBTApp.remainingSeconds / 3600);
                const m = Math.floor((CBTApp.remainingSeconds % 3600) / 60);
                const s = CBTApp.remainingSeconds % 60;
                const el = document.getElementById('exam-timer');
                if (el) el.innerText = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
                CBTApp.remainingSeconds--;
            }, 1000);
        }

        window.finishExam = function() {
            if (CBTApp.timerInterval) clearInterval(CBTApp.timerInterval);

            document.removeEventListener('visibilitychange', handleViolation);
            window.removeEventListener('blur', handleViolation);
            if (document.exitFullscreen) document.exitFullscreen().catch(()=>{});

            const session = CBTApp.currentExamSession;
            let achieved = 0;
            let total = 0;
            let answersDetail = {};

            session.questions.forEach(q => {
                total += q.weight;
                const uAns = CBTApp.userAnswers[q.id];

                // HANYA REKAM JAWABAN ISIAN DAN ESSAY
                if (q.type === 'isian' || q.type === 'essay') {
                    answersDetail[q.questionText] = uAns || "(Tidak dijawab)";
                }

                if (q.type === 'pg' || !q.type) {
                    if (uAns === q.correctAnswer) achieved += q.weight;
                } else if (q.type === 'pgk') {
                    if (Array.isArray(uAns) && Array.isArray(q.correctAnswer)) {
                        const s1 = [...uAns].sort().join('');
                        const s2 = [...q.correctAnswer].sort().join('');
                        if (s1 === s2) achieved += q.weight;
                    }
                } else if (q.type === 'bs') {
                    if (uAns === q.correctAnswer) achieved += q.weight;
                } else if (q.type === 'matching') {
                    if (typeof uAns === 'object' && uAns !== null) {
                        let allMatch = true;
                        (q.pairs || []).forEach(p => {
                            if (uAns[p.left] !== p.right) allMatch = false;
                        });
                        if (allMatch) achieved += q.weight;
                    }
                } else if (q.type === 'isian') {
                    if (String(uAns || '').trim().toLowerCase() === String(q.correctAnswer || '').trim().toLowerCase()) {
                        achieved += q.weight;
                    }
                } else if (q.type === 'essay') {
                    if (uAns && String(uAns).trim().length > 5) achieved += Math.round(q.weight * 0.5);
                }
            });

            const percentage = total > 0 ? (achieved / total) * 100 : 0;
            const res = {
                id: 'res_' + Date.now(),
                sessionId: session.id,
                token: session.token,
                studentName: CBTApp.studentInfo.name,
                studentClass: CBTApp.studentInfo.class,
                score: achieved,
                maxScore: total,
                percentage: percentage,
                violations: CBTApp.violationCount,
                submittedAt: new Date().toLocaleTimeString("id-ID", { hour: '2-digit', minute: '2-digit' }),
                answersDetail: answersDetail
            };

            CBTApp.results.unshift(res);
            CBTApp.save('results');

            // Kirim nilai & isian jawaban ke Google Sheets
            const activeCloudUrl = CBTApp.gasUrl || DEFAULT_GOOGLE_SCRIPT_URL;
            if (activeCloudUrl && activeCloudUrl.startsWith('http')) {
                fetch(activeCloudUrl, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'submitResult', result: res })
                }).then(() => {
                    console.log("Nilai & Isian terkirim ke Google Sheets!");
                }).catch(e => console.warn("Submit GAS error:", e));
            }

            const container = document.getElementById('app-container');
            container.innerHTML = `
                <div class="max-w-md mx-auto my-12 bg-white p-8 rounded-3xl shadow-xl border border-slate-100 text-center">
                    <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-2xl flex items-center justify-center text-3xl mx-auto mb-4">
                        <i class="fa-solid fa-check"></i>
                    </div>
                    <h2 class="text-xl font-bold text-slate-800">Ujian Telah Selesai!</h2>
                    <p class="text-xs text-slate-500 mt-1 mb-4">Lembar jawaban Anda telah tersimpan di server proktor.</p>
                    
                    <div class="p-4 bg-slate-50 rounded-2xl border border-slate-200 my-4 text-xs space-y-2">
                        <div class="flex justify-between"><span>Nama:</span><strong class="text-slate-800">${res.studentName}</strong></div>
                        <div class="flex justify-between"><span>Kelas:</span><strong class="text-slate-800">${res.studentClass}</strong></div>
                        <div class="flex justify-between"><span>Pelanggaran Layar/Tab:</span><strong class="${res.violations > 0 ? 'text-rose-600' : 'text-emerald-600'}">${res.violations} kali</strong></div>
                        <div class="flex justify-between border-t pt-2 text-sm font-bold"><span>Nilai Akhir:</span><span class="text-indigo-600">${res.percentage.toFixed(0)}%</span></div>
                    </div>
                </div>
            `;
            CBTApp.currentExamSession = null;
        };

        // Inisialisasi Aplikasi
        window.onload = function() {
            if (isStudentView()) {
                renderStudentLanding();
            } else {
                renderProctorDashboard();
            }
        };
    </script>
</body>
</html>
